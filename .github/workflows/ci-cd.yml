name: CI/CD - Test, Docker Verify & Free Render Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Syntax & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax & JSON configs
        run: |
          node --check server.js
          for f in src/*.js public/js/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8'));"

      - name: Generate built-in synth music tracks
        run: node scripts/generate-upbeat-tracks.mjs

      - name: Run CI test suites
        run: npm run test:ci

  docker-build:
    name: Verify Production Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag xom-trade-live:ci .

  deploy-render:
    name: Trigger Render Free Deploy (via Deploy Hook)
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL chưa được cấu hình — Render sẽ tự deploy qua GitHub Auto-Deploy (autoDeploy: true trong render.yaml)."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Đã kích hoạt deploy lên Render thành công!"
